name: "RTK Base Station (Unicore/u-blox)"
version: "0.2.22"
slug: "gnss_rtk_base"
description: >-
  Reads a GNSS RTK receiver over serial (Unicore UM980/UM982 or u-blox
  ZED-F9P/M8P, selectable via receiver_type — other receivers can be
  added as a new driver in drivers/), sends RTCM corrections as an NTRIP
  server (via RTKLIB str2str) to one or more casters, and exposes
  status/controls in Home Assistant via MQTT (fix status, satellites,
  accuracy, survey-in, manual position).
url: "https://github.com/pedronick/ha-gnss-rtk-addon"
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
# Required because the base image uses s6-overlay as its init (/init, PID 1):
# without init:false, Supervisor wraps the container with Docker's own
# init/tini, which becomes PID 1 instead of s6-overlay, causing
# "s6-overlay-suexec: fatal: can only run as pid 1" at startup.
init: false
uart: true
usb: true
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:crosshairs-gps
panel_title: "RTK Base"
ports:
  "2101/tcp": 2101
ports_description:
  "2101/tcp": "Local NTRIP Caster for rovers (active only if caster_enabled: true)"
services:
  - mqtt:want
options:
  # Receiver driver: see drivers/ for the available options and how to
  # add another one. "unicore_um98x" = Unicore UM980/UM982,
  # "ublox_zedf9p" = u-blox ZED-F9P/F9R/M8P.
  receiver_type: "unicore_um98x"
  rtcm_port: "/dev/ttyUSB0"
  nmea_port: "/dev/ttyUSB0"
  baudrate: 115200
  survey_in_duration_sec: 300
  ppp_duration_hours: 6
  raw_log_retention_hours: 72
  # List of NTRIP casters to send corrections to: add/remove entries as
  # you like from the add-on UI (+/- buttons on the list). Each entry with
  # a non-empty "host" generates an extra -out on the same str2str
  # instance; entries with an empty host are ignored. No "user" field:
  # in the NTRIP1 protocol, the server/encoder role (str2str -out ntrips://)
  # authenticates only with the mountpoint password, not with a username.
  ntrip_casters:
    - host: ""
      port: 2101
      mountpoint: ""
      password: ""
    - host: ""
      port: 2101
      mountpoint: ""
      password: ""
  caster_enabled: false
  caster_mountpoint: "GNSSBASE"
  caster_user: ""
  caster_password: ""
  caster_max_clients: 10
schema:
  receiver_type: list(unicore_um98x|ublox_zedf9p)
  rtcm_port: str
  nmea_port: str
  baudrate: int
  survey_in_duration_sec: int(60,86400)
  ppp_duration_hours: int(1,48)
  raw_log_retention_hours: int(6,720)
  ntrip_casters:
    - host: str?
      port: int
      mountpoint: str?
      password: password?
  caster_enabled: bool
  caster_mountpoint: str
  caster_user: str?
  caster_password: password?
  caster_max_clients: int(1,1000)
